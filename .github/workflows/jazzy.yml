name: Jazzy

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-24.04
    container: ros:jazzy-ros-base-noble
    timeout-minutes: 30
    env:
      ROS_DISTRO: jazzy
      ROS_AUTOMATIC_DISCOVERY_RANGE: LOCALHOST
      ROS_LOG_DIR: /tmp/z-localization-ros-logs
      CMAKE_BUILD_PARALLEL_LEVEL: '2'
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Install dependencies
        run: |
          apt-get update
          apt-get install -y --no-install-recommends python3-colcon-common-extensions python3-rosdep
          if [ ! -f /etc/ros/rosdep/sources.list.d/20-default.list ]; then
            rosdep init
          fi
          rosdep update --rosdistro jazzy
          rosdep install --from-paths src --ignore-src --rosdistro jazzy -r -y
      - name: Build with warnings as errors
        run: |
          source /opt/ros/jazzy/setup.bash
          colcon build --executor sequential --event-handlers console_direct+ --cmake-args \
            -DCMAKE_BUILD_TYPE=Release \
            -DLOCALIZATION_WARNINGS_AS_ERRORS=ON
      - name: Test
        run: |
          source /opt/ros/jazzy/setup.bash
          source install/setup.bash
          colcon test --executor sequential --return-code-on-test-failure --event-handlers console_direct+
      - name: Test results
        if: always()
        run: colcon test-result --verbose
